name: Deploy Node.js App via SSH Key

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" 'bash -s' <<'EOF'

              set -e

              cd /home/dev/node-api

              git fetch origin
              git checkout -f -B main origin/main

              npm install --production

              pm2 restart node-api || pm2 start app.js --name node-api

              pm2 save

          EOF
