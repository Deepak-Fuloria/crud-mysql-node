name: Simple VPS Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Run commands on VPS via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: "${{ secrets.VPS_SSH_KEY }}" # Yahan quotes double-verify karte hain key ko string format mein
        script_stop: true # Kisi bhi error par pipeline pehle hi ruk jaye
        script: |
          cd /home/dev/node-api
          git pull origin main
          npm install --production
          pm2 restart app.js || pm2 start app.js --name "node-api"
