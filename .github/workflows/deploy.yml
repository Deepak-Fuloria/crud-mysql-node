name: Simple VPS Deploy

on:
  push:
    branches: [ main ] # Jab bhi 'main' branch par push hoga tab chalega

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Run commands on VPS via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}       # Server IP
        username: ${{ secrets.VPS_USER }}   # Server Username (ubuntu ya root)
        key: ${{ secrets.VPS_SSH_KEY }}     # Private SSH Key
        script: |
          cd /var/www/crud-mysql             # 1. Apne VPS ke project folder mein jao
          git pull origin main               # 2. GitHub se naya code khincho
          npm install                        # 3. Agar koi nayi dependency hai toh install karo
          node index.js &                    # 4. App ko background mein chala do
